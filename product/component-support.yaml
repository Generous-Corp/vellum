schema_version: 1
abi: vellum.component-abi.v1
native:
  macos_arm64:
    installed_sdk_build: supported
    app_owned_module: dylib
    sterile_build_capture_package_proof: required
web:
  declared_fallback: supported-in-retained-tree
  wasm_source:
    abi_compile_and_execution_proof: supported
    proof_command: scripts/verify_component_wasm.py
    installed_web_backend_integration: supported
    vellum_build_target_web: supported
    app_owned_module: linked-es-module-and-wasm
    compiler_prerequisite: activated-emscripten-sdk-with-em++
    malformed_output: fail-closed
    silent_fallback_for_wasm_declaration: forbidden
    browser_scenario_proof: required
claims:
  - custom_components requires the installed public ABI and browser adapter payload
  - web wasm support is source-linked per application and does not dynamically load native modules
  - web scenario action parity covers wait capture press click input and bounded semantic keys
  - web scenario parity does not claim native persistence or web capture-montage command parity
