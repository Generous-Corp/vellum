schema_version: 1
default_channel: supported
sources:
  design-ir:
    channel: supported
    accepted_artifact: canonical Vellum DesignIR v1 JSON
    provider_access: none
    reimport: supported
  figma:
    channel: supported
    accepted_artifact: single-root audio-free Pulp Figma plugin JSON or .pulp.zip export
    provider_access: none
    reimport: supported
    pinned_contract:
      format_version: 2026.05-figma-plugin-v1
      parser_version: 0.1.0
      compat_schema_version: "0.3"
      schema: https://pulp.dev/schemas/figma-plugin-export-v1.json
    current_pulp_emitter_node_types:
      frame: direct-view-node-kind-with-property-diagnostics
      text: direct-text-node-kind-with-property-diagnostics
      ellipse: diagnosed-view-lowering
      image: diagnosed-view-placeholder
      vector: diagnosed-view-placeholder
    legacy_compatibility_node_types:
      button: diagnosed-button-lowering
      col: diagnosed-view-lowering
      input: diagnosed-view-placeholder
      label: diagnosed-text-lowering
      panel: diagnosed-view-lowering
      path: diagnosed-view-placeholder
      row: diagnosed-view-lowering
    integrity:
      pulp_zip:
        scene_files: exactly-one-.pulp.json
        original_archive_snapshot: immutable
        revision_identity: archive-sha256
        extraction_dependency: python-standard-library
        rejected_members:
          - traversal-or-noncanonical-path
          - absolute-backslash-or-drive-path
          - link-or-special-file
          - duplicate-or-case-collision
        bounded:
          archive_bytes: 268435456
          members: 10000
          member_bytes: 134217728
          member_path_bytes: 1024
          scene_bytes: 16777216
          total_uncompressed_bytes: 536870912
          compression_ratio: 200
      content_hash_wire_forms:
        - 64-lower-or-upper-hex
        - sha256:64-lower-or-upper-hex
      canonical_form: sha256:64-lower-hex
      verified_on:
        - import
        - changed-reimport
        - unchanged-reimport
    limitations:
      - does not accept arbitrary .fig files
      - does not call the Figma REST API
      - accepts exactly one root and rejects the synthetic multi-export root
      - the current Pulp extractor can audio-promote generic-looking layer names
      - rejects audio-widget nodes and audio-specific binding fields
      - image and vector assets are preserved but not painted by the native host
      - unsupported properties and fields remain explicit diagnostics and extensions
  figma-rest:
    channel: unavailable
  figma-file:
    channel: unavailable
  claude-design:
    channel: unavailable
    preflight_contract: vellum.html-source-preflight.v1
    note: "Claude producer fingerprinting is covered by HTML preflight; browser import and Claude sidecar lowering remain incomplete."
  react-project:
    channel: unavailable
  html:
    channel: unavailable
    preflight_contract: vellum.html-source-preflight.v1
    note: "P5 admission and contained staging are implemented; browser import remains unavailable until the end-to-end capture path lands."
    security_boundary:
      - local-relative-dependencies-only
      - no-network-fetch-during-preflight
      - symlink-and-traversal-rejected
      - bounded-source-tree
invariants:
  - the normal CLI accepts only sources in the supported channel
  - experimental routes require an explicit experimental flag
  - unavailable routes are never advertised as working quick starts
  - every accepted source is normalized into versioned inspectable DesignIR
