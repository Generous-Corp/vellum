  "rationale": "Vellum's figma-plugin.js decoder now refuses a negative border width, blur or spread. The decoder is Vellum's own. Pulp parses box_shadow lengths in parse_css_box_shadow and clamps a negative blur to 0 at paint in its canvases, and resolve_border_edges clamps a negative border width to 0, so it has no unguarded path to fix. Nothing to port. Note for Vellum: CSS allows a negative spread radius, so rejecting it drops valid shadows. Evidence, Pulp main b0ee92d21944d5c956603afd1108b575e50c1302 (full clone): [absent] `git -C <pulp> grep -c -F -e 'CSS_NONNEGATIVE_LENGTH' b0ee92d21944 -- core tools test examples apple ship inspect` = 0; [control] `git -C <pulp> grep -c -F -e 'std::max(0.0f, blur' b0ee92d21944 -- core/canvas` = 4; [control] `git -C <pulp> grep -c -F -e 'std::max(0.0f, side.width)' b0ee92d21944 -- core/view/src/view_paint.cpp` = 1. [control] searches show the instrument finds the nearest Pulp counterpart. Classified by the Vellum lead under the owner's one-time delegation of 2026-11-24 (pulp-planning vellum-move/DECISIONS.md); any later resolution overrides it.",
