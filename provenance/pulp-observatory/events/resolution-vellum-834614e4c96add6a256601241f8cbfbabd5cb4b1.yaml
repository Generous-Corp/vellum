  "rationale": "vellum-ui's JavaScript validators now measure the shared byte limits (path data, vector path data, text input, anchor and source file) in UTF-8 bytes through a new utf8ByteLength helper, matching the native checks that already count UTF-8 bytes; before this, JavaScript counted UTF-16 code units, so a value could pass JavaScript and fail natively. The rendered-tree materializer's native diagnostics now read their numbers from the shared limits constants instead of repeating them. No limit value changes. vellum-ui and the rendered-tree materializer exist only in Vellum, so no port is owed. Classified by the Vellum lead.",
