  "rationale": "Moves the limits already enforced by graphics and the JavaScript packages into one header, graphics/include/vellum/graphics/limits.hpp, and generates the vellum-design-ir and vellum-ui copies from it. The consumers (scene, animation, path geometry, validate.js, design.js, runtime.js, the rendered-tree materializer) now read the shared names. No limit value changes: the Vellum lead compared each removed constant with its new value (plot slots 1<<22 = 4194304, path data 64*1024 = 65536, dashes 64, vector ops 16384, group depth 64, audio channel 1024, plot stroke 4096, 32 tracks, 256 keyframes, float32 max), and the drift tests check the header and both generated copies against limits.fixture.json. These packages are Vellum's and Pulp consumes them from Vellum (the owner's 2026-11-16 04:45Z criterion for schema-class events). Classified by the Vellum lead.",
