  "rationale": "Offline .fig decoder import. The decoder files are Pulp's tools/import-design/fig/*.mjs and fig_decode.mjs at d4bf36a8 (tests from 9fa7e5cb): all eight pulp_sha256 values in provenance/importers/fig-decode.json match those Pulp blobs, and both commits are ancestors of Pulp main. The backend glue (backend-source.js, fig-file/import.js, index.js) is Vellum-native. One Vellum addition is missing from Pulp: container.mjs resolves zlib.zstdDecompressSync lazily and reports that zstd needs Node 22.15, while Pulp's container.mjs imports zstdDecompressSync by name, so on Node 22.0-22.14 the module fails to load even for deflate-only files. Debt to port: the lazy zstd lookup and its error in tools/import-design/fig/container.mjs. Evidence, Pulp main b0ee92d21944d5c956603afd1108b575e50c1302 (full clone): [absent] `git -C <pulp> grep -c -F -e 'typeof zlib.zstdDecompressSync' b0ee92d21944 -- tools/import-design/fig` = 0; [present] `git -C <pulp> grep -c -F -e 'import { inflateRawSync, zstdDecompressSync } from 'node:zlib'' b0ee92d21944 -- tools/import-design/fig/container.mjs` = 1; [absent] `git -C <pulp> grep -c -F -e 'decodeFigSource' b0ee92d21944 -- tools/import-design core` = 0; [control] `git -C <pulp> grep -c -F -e 'export function unpackFig' b0ee92d21944 -- tools/import-design/fig` = 1. [control] searches show the instrument finds the nearest Pulp counterpart. Classified by the Vellum lead under the owner's one-time delegation of 2026-11-24 (pulp-planning vellum-move/DECISIONS.md); any later resolution overrides it.",
