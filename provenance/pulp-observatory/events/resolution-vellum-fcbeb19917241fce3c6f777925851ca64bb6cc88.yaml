  "rationale": "The original cross-repository diagnosis does not apply: JSON.stringify escapes U+0000, so Pulp's serialized JSON text was not vulnerable to C-string truncation. The review did uncover a separate adjacent defect in Pulp's direct JavaScriptCore string boundary, which now rejects CHOC-unrepresentable embedded NUL values and fails closed for callback, serialization, exception, array accessor, length, and cycle errors. Vellum keeps its full-length NSString conversion because its rendered-JSON boundary has different ownership and representation requirements.",
