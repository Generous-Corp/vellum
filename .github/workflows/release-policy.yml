name: Release policy

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      # Full history: test_release_request.py replays the tag's observatory
      # check on Vellum's own release commits; test_release_cadence.py reads tags.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release-signing policy
        run: |
          set -euo pipefail
          python3 -I scripts/run_ci_lane.py --lane release-policy

      # Advisory: a Version-Bump trailer that version-at-land cannot read is
      # skipped there with a warning, so name it here while it can still be fixed.
      - name: Lint Version-Bump trailers (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/version_at_land.py lint --revisions "$BASE_SHA..$HEAD_SHA" || true
