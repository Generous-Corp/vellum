name: README clean release proof
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 11 * * 2"
permissions:
  attestations: read
  contents: read
jobs:
  clean-release:
    runs-on: ${{ fromJSON(vars.VELLUM_PR_MACOS_RUNS_ON_JSON || '["macos-15"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute authenticated README quick start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/readme_exec.py \
            --execute-profile clean-release \
            --evidence-dir "$RUNNER_TEMP/readme-clean-release"
      - name: Retain transcript, environment, and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readme-clean-release-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-clean-release
          if-no-files-found: error
          retention-days: 7
