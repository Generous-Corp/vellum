name: README clean release proof
on:
  workflow_dispatch:
  pull_request:
  # Merge-queue builds: the queue merges main's tip with the PR head on a
  # gh-readonly-queue/* ref and needs every required check on that commit.
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 2"
permissions:
  attestations: read
  contents: read

concurrency:
  # GitHub keeps only one pending run per concurrency group. Keep PRs keyed
  # by ref so obsolete commits are canceled, but isolate scheduled, trusted,
  # and manually dispatched runs by run ID.
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('vellum-readme-pr-{0}', github.ref) || format('vellum-readme-run-{0}', github.run_id) }}
  # Keep scheduled, main, and authenticated release checks intact; only
  # obsolete PR quick-start checks may be canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-release:
    runs-on: ${{ fromJSON(vars.VELLUM_MACOS_RUNS_ON_JSON || '["macos-15"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # An evidence-only change (the coalesced observatory evidence pull
      # requests) cannot reach what this job checks, so its steps are skipped
      # and the job still reports success. The classifier is the Locked GPU
      # proof's (scripts/classify_gpu_proof.py) and is read from the base, never
      # from the change, so a pull request cannot widen it; any doubt, and every
      # push, tag and dispatch, runs the full job.
      - name: Classify the change against the base's rules
        id: classify
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          base="${QUEUE_BASE:-$GITHUB_SHA^1}"
          classifier="$RUNNER_TEMP/base-classify-gpu-proof.py"
          verdict=""
          if { [ "$GITHUB_EVENT_NAME" != merge_group ] || [ -n "$QUEUE_BASE" ]; } &&
             git show "$base:scripts/classify_gpu_proof.py" > "$classifier" 2>/dev/null &&
             git diff --name-only -z --no-renames "$base" "$GITHUB_SHA" \
               > "$RUNNER_TEMP/changed-paths" &&
             verdict="$(python3 -I "$classifier" --files0-from "$RUNNER_TEMP/changed-paths")"; then
            :
          fi
          if [ "$verdict" = not-required ]; then
            echo "::notice::The base's classifier proves this change is observatory evidence only; skipping"
            echo "unaffected=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Running the full job (classifier verdict: ${verdict:-unavailable})"
          fi
      - name: Validate the README release contract without credentials
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.classify.outputs.unaffected != 'true'
        run: |
          python3 scripts/test_readme_exec.py
          python3 scripts/readme_exec.py --lint
      - name: Refuse authenticated execution outside trusted main
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Execute authenticated README quick start from trusted main
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.VELLUM_CANONICAL_READ_TOKEN || github.token }}
        run: |
          python3 scripts/readme_exec.py \
            --execute-profile clean-release \
            --evidence-dir "$RUNNER_TEMP/readme-clean-release"
      - name: Retain transcript, environment, and timings
        if: always() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readme-clean-release-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-clean-release
          if-no-files-found: error
          retention-days: 90

      # Re-derive the skip from scratch: a skipped job must be one the base's
      # classifier allows for exactly this change, on an event that may skip.
      - name: Prove a skipped job was allowed
        if: always() && steps.classify.outputs.unaffected == 'true'
        shell: bash
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in pull_request|merge_group) ;; *)
            echo "::error::a $GITHUB_EVENT_NAME run may not skip this job"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = merge_group ] && [ -z "$QUEUE_BASE" ]; then
            echo "::error::a queue run without merge_group.base_sha may not skip this job"; exit 1
          fi
          base="${QUEUE_BASE:-$GITHUB_SHA^1}"
          guard="$RUNNER_TEMP/guard-classify-gpu-proof.py"
          git show "$base:scripts/classify_gpu_proof.py" > "$guard"
          git diff --name-only -z --no-renames "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/guard-paths"
          verdict="$(python3 -I "$guard" --files0-from "$RUNNER_TEMP/guard-paths")"
          if [ "$verdict" != not-required ]; then
            echo "::error::the job was skipped, but the base's classifier says: $verdict"
            exit 1
          fi
          tr '\0' '\n' < "$RUNNER_TEMP/guard-paths"
