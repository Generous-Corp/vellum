name: Pulp observatory watchdog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: vellum-pulp-observatory-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: watchdog
    # No configuration gate: a watchdog that can be left switched off is a
    # watchdog that is silently off. Every scheduled run evaluates.
    runs-on: ubuntu-latest
    steps:
      - name: Mint a Vellum watchdog token
        id: watchdog-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: Generous-Corp
          repositories: vellum
          permission-actions: write
          permission-pull-requests: read

      - name: Mint a read-only Pulp token for the fresh checkout
        id: pulp-reader
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: Generous-Corp
          repositories: pulp
          permission-contents: read

      - name: Check out trusted Vellum main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out freshly fetched Pulp main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Generous-Corp/pulp
          token: ${{ steps.pulp-reader.outputs.token }}
          ref: main
          path: .watchdog-pulp
          fetch-depth: 0
          persist-credentials: false

      - name: Build independent watchdog state
        env:
          GH_TOKEN: ${{ steps.watchdog-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/provenance/test_receiver_watchdog_state.py
          python3 tools/provenance/receiver_watchdog_state.py \
            --root . \
            --pulp-repo .watchdog-pulp \
            --output "$RUNNER_TEMP/watchdog-base.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/pulp-observatory-receiver.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | {status, conclusion, created_at}]' \
            > "$RUNNER_TEMP/receiver-runs.json"
          evidence_pr_count="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$GITHUB_REPOSITORY_OWNER:automation/pulp-observatory-coalesced" \
              -f per_page=100 \
              --jq 'length' | \
              awk '{ total += $1 } END { print total + 0 }'
          )"
          jq -s --argjson evidence_pr_open "$((evidence_pr_count > 0))" \
            '.[0] + {runs: .[1], evidence_pr_open: ($evidence_pr_open == 1)}' \
            "$RUNNER_TEMP/watchdog-base.json" \
            "$RUNNER_TEMP/receiver-runs.json" \
            > "$RUNNER_TEMP/watchdog-state.json"

      - name: Evaluate cursor, runner, delivery, and pending-budget health
        id: evaluate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/provenance/receiver_watchdog.py \
            --policy provenance/pulp-observatory/receiver-policy.json \
            --state "$RUNNER_TEMP/watchdog-state.json" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/watchdog-result.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Retry lag or refresh an aging receiver heartbeat
        env:
          GH_TOKEN: ${{ steps.watchdog-token.outputs.token }}
        run: |
          set -euo pipefail
          if test "$(jq -r .dispatch_required "$RUNNER_TEMP/watchdog-result.json")" = true; then
            target="$(jq -r .latest_target "$RUNNER_TEMP/watchdog-state.json")"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pulp-observatory-receiver.yml/dispatches" \
              --input <(jq -n --arg commit "$target" '{
                ref: "main",
                inputs: {pulp_commit: $commit, operation: "replay"}
              }')
          fi

      - name: Fail observably after any retry request
        run: test "$(jq -r .status "$RUNNER_TEMP/watchdog-result.json")" = pass
