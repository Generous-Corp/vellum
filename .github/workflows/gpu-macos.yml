name: Locked macOS GPU proof

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*', 'authority/**']

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: vellum-gpu-${{ github.ref }}
  cancel-in-progress: false

env:
  VELLUM_RELEASE_VERSION: 0.1.7
  VELLUM_RELEASE_TAG: v0.1.7
  VELLUM_RELEASE_ARCHIVE: vellum-sdk-0.1.7-darwin-arm64.tar.gz
  VELLUM_RELEASE_NAME: Vellum 0.1.7 experimental SDK

jobs:
  gpu-macos-arm64:
    name: gpu-macos-arm64
    runs-on: ${{ fromJSON(vars.VELLUM_MACOS_RUNS_ON_JSON || '["self-hosted","macOS","ARM64","vellum-build-macos"]') }}
    steps:
      - name: Check out full preserved Vellum history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify the locked Skia and Dawn archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/skia-build-mac-arm64-gpu-release.zip"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --continue-at - \
            https://github.com/danielraffel/skia-builder/releases/download/chrome/m150/skia-build-mac-arm64-gpu-release.zip \
            --output "$archive"
          printf '%s  %s\n' \
            13b0e9818c3b05db661af85cb1e2bf2ef10e30d468b81351dd90295237d17734 \
            "$archive" | shasum -a 256 -c -
          printf 'VELLUM_SKIA_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Set up the authoring toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/vellum-ui/package-lock.json

      - name: Verify the exact release source contract
        run: |
          python3 -m unittest discover -s cli/tests -p 'test_*.py'
          python3 -m unittest tools.agent_instructions.test_verify
          python3 scripts/test_readme_exec.py
          python3 scripts/readme_exec.py --lint
          python3 scripts/test_readme_lint.py
          python3 scripts/readme_lint.py
          python3 scripts/test_docs_sync.py
          python3 scripts/docs_sync.py --check
          python3 scripts/template_guard.py
          python3 scripts/test_templates_smoke.py
          python3 scripts/test_sterile_acceptance_bundle.py
          python3 scripts/test_select_exact_provenance_run.py
          python3 scripts/test_verify_exact_provenance_artifact.py
          python3 scripts/test_run_parity_proofs.py
          python3 scripts/test_verify_budget_ratification.py
          python3 scripts/verify_budget_ratification.py
          python3 tools/provenance/test_verify_downstream_consumers.py
          python3 tools/provenance/verify_downstream_consumers.py
          python3 tools/provenance/test_verify_extraction.py
          python3 tools/provenance/verify_extraction.py \
            --output "$RUNNER_TEMP/provenance-report.json"
          npm run check --prefix packages/vellum-design-ir

      - name: Build the installed TypeScript and JSX Phase 3 fixture
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix packages/vellum-ui
          npm test --prefix packages/vellum-ui
          npm run --prefix packages/vellum-ui build:native-test -- \
            "$RUNNER_TEMP/vellum-ui-native.iife.js"
          printf 'VELLUM_AUTHORING_TEST_BUNDLE=%s\n' \
            "$RUNNER_TEMP/vellum-ui-native.iife.js" >> "$GITHUB_ENV"
          fixture_root="$RUNNER_TEMP/phase3-installed"
          cp -R fixtures/authoring-phase3 "$fixture_root"
          mkdir -p "$RUNNER_TEMP/phase3-packages"
          package_json="$(
            npm pack ./packages/vellum-ui \
              --pack-destination "$RUNNER_TEMP/phase3-packages" --json
          )"
          archive_name="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(0, "utf8"));
              process.stdout.write(value[0].filename);
            ' <<<"$package_json"
          )"
          npm pkg set \
            "dependencies.@vellum/ui=file:$RUNNER_TEMP/phase3-packages/$archive_name" \
            --prefix "$fixture_root"
          npm install --offline --ignore-scripts --no-audit --no-fund \
            --package-lock=false --prefix "$fixture_root"
          bundle="$RUNNER_TEMP/vellum-phase3-native.iife.js"
          VELLUM_BUILD_FORMAT=iife \
          VELLUM_PROJECT_ROOT="$fixture_root" \
            node "$fixture_root/node_modules/@vellum/ui/scripts/build-project.mjs" \
              "$fixture_root/src/App.tsx" "$bundle"
          printf 'VELLUM_PHASE3_TEST_BUNDLE=%s\n' "$bundle" \
            >> "$GITHUB_ENV"

      - name: Build the release GPU slice
        run: |
          cmake -S . -B build-gpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DVELLUM_BUILD_TESTS=ON \
            -DVELLUM_REQUIRE_GPU=ON \
            -DVELLUM_AUTHORING_TEST_BUNDLE="$VELLUM_AUTHORING_TEST_BUNDLE" \
            -DVELLUM_PHASE3_TEST_BUNDLE="$VELLUM_PHASE3_TEST_BUNDLE" \
            -DVELLUM_SKIA_ARCHIVE="$VELLUM_SKIA_ARCHIVE"
          cmake --build build-gpu --parallel

      - name: Stress parallel text shaping in Release
        run: |
          VELLUM_TEXT_STRESS_ROUNDS=100 \
            ./build-gpu/vellum-text-shaping-concurrency-test

      - name: Stress parallel text shaping with AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-gpu-asan \
            -DCMAKE_BUILD_TYPE=Release \
            -DVELLUM_BUILD_TESTS=ON \
            -DVELLUM_BUILD_SMOKE_NATIVE=OFF \
            -DVELLUM_ENABLE_AUTHORING=OFF \
            -DVELLUM_ENABLE_ADDRESS_SANITIZER=ON \
            -DVELLUM_REQUIRE_GPU=ON \
            -DVELLUM_SKIA_ARCHIVE="$VELLUM_SKIA_ARCHIVE"
          cmake --build build-gpu-asan \
            --target vellum-text-shaping-concurrency-test --parallel
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=0:halt_on_error=1 \
          VELLUM_TEXT_STRESS_ROUNDS=20 \
            ./build-gpu-asan/vellum-text-shaping-concurrency-test

      - name: Install the pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emsdk="$RUNNER_TEMP/emsdk"
          git init "$emsdk"
          git -C "$emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$emsdk" fetch --depth=1 origin \
            7f06d88dc04b71a08d0c275df9cb68337e7128fd
          git -C "$emsdk" checkout --detach FETCH_HEAD
          "$emsdk/emsdk" install 6.0.2
          "$emsdk/emsdk" activate 6.0.2
          printf 'VELLUM_EMSDK=%s\n' "$emsdk" >> "$GITHUB_ENV"

      - name: Install the pinned Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: 151.0.7922.47

      - name: Export the pinned Chrome browser path
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          printf 'VELLUM_CHROME_PATH=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Record exact Chrome browser provenance
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python3 scripts/create_browser_provenance.py \
            --browser "$CHROME_PATH" \
            --requested-version 151.0.7922.47 \
            --source-action browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd \
            --output "$RUNNER_TEMP/browser-provenance.json"
          cp scripts/create_browser_provenance.py "$RUNNER_TEMP/create_browser_provenance.py"
          cp cli/vellum_browser.py "$RUNNER_TEMP/vellum_browser.py"
          printf 'VELLUM_CHROME_PROVENANCE=%s\n' "$RUNNER_TEMP/browser-provenance.json" >> "$GITHUB_ENV"
          printf 'VELLUM_REQUIRE_CHROME_PROVENANCE=1\n' >> "$GITHUB_ENV"

      - name: Build the source-matched browser payload
        shell: bash
        run: |
          set -euo pipefail
          export EMSDK_QUIET=1
          source "$VELLUM_EMSDK/emsdk_env.sh"
          python3 scripts/build_web_payload.py \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/web-payload" \
            --json > "$RUNNER_TEMP/web-payload.json"
          python3 web/tests/run_text_semantics_browser.py \
            --core-root "$RUNNER_TEMP/web-payload" \
            --source-root "$GITHUB_WORKSPACE" \
            --fixture phase3 \
            > "$RUNNER_TEMP/phase3-browser-evidence.json"

      - name: Verify renderer provenance and byte identity
        run: |
          python3 tools/provenance/verify_renderer_dependency.py \
            --archive "$VELLUM_SKIA_ARCHIVE" \
            --require-macho

      - name: Run native, capture, and sterile-consumer tests
        run: |
          ctest --test-dir build-gpu --output-on-failure
          ./build-gpu/apps/gpu-native/vellum-gpu-native.app/Contents/MacOS/vellum-gpu-native \
            --self-test --capture "$RUNNER_TEMP/vellum-gpu-proof.png" \
            | tee "$RUNNER_TEMP/vellum-gpu-proof.txt"
          file "$RUNNER_TEMP/vellum-gpu-proof.png"
          shasum -a 256 "$RUNNER_TEMP/vellum-gpu-proof.png" \
            > "$RUNNER_TEMP/vellum-gpu-proof.sha256"

      - name: Execute every declared parity proof
        if: hashFiles('provenance/authority/expansions/full-design-import-render-v1/parity-completion-1.json') != ''
        run: |
          python3 scripts/run_parity_proofs.py \
            --completion provenance/authority/expansions/full-design-import-render-v1/parity-completion-1.json \
            --output "$RUNNER_TEMP/vellum-parity-proof-execution.json"

      - name: Upload parity proof execution receipt
        if: hashFiles('provenance/authority/expansions/full-design-import-render-v1/parity-completion-1.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellum-parity-proof-execution
          path: ${{ runner.temp }}/vellum-parity-proof-execution.json
          if-no-files-found: error
          retention-days: 14

      - name: Prove the installed SDK artifact is reproducible
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/sdk-first"
          second="$RUNNER_TEMP/sdk-second"
          node_binary="$(command -v node)"
          node_version="$(node -p 'process.versions.node')"
          node_platform="$(node -p 'process.platform')"
          node_arch="$(node -p 'process.arch')"
          node_dist="node-v${node_version}-${node_platform}-${node_arch}.tar.gz"
          node_url="https://nodejs.org/dist/v${node_version}/${node_dist}"
          node_dist_sha="$(curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" | awk -v name="$node_dist" '$2 == name { print $1 }')"
          test -n "$node_dist_sha"
          node_license="$(node -p "require('path').join(require('path').dirname(require('path').dirname(process.execPath)), 'LICENSE')")"
          test -s "$node_license"
          NODE_BINARY="$node_binary" NODE_LICENSE="$node_license" NODE_VERSION="$node_version" \
            NODE_URL="$node_url" NODE_DIST_SHA="$node_dist_sha" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          record = {
              "schema": "vellum.node-runtime-provenance.v1",
              "name": "Node.js",
              "version": os.environ["NODE_VERSION"],
              "target": "darwin-arm64",
              "source_url": os.environ["NODE_URL"],
              "distribution_sha256": os.environ["NODE_DIST_SHA"],
              "binary_sha256": digest(os.environ["NODE_BINARY"]),
              "license_file": "LICENSE",
              "license_sha256": digest(os.environ["NODE_LICENSE"]),
          }
          Path(os.environ["RUNNER_TEMP"], "node-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 scripts/build_sdk_artifact.py \
            --skia-archive "$VELLUM_SKIA_ARCHIVE" \
            --web-payload "$RUNNER_TEMP/web-payload" \
            --node-binary "$node_binary" \
            --node-license "$node_license" \
            --node-provenance "$RUNNER_TEMP/node-provenance.json" \
            --output-dir "$first" --json > "$RUNNER_TEMP/sdk-first.json"
          python3 scripts/build_sdk_artifact.py \
            --skia-archive "$VELLUM_SKIA_ARCHIVE" \
            --web-payload "$RUNNER_TEMP/web-payload" \
            --node-binary "$node_binary" \
            --node-license "$node_license" \
            --node-provenance "$RUNNER_TEMP/node-provenance.json" \
            --output-dir "$second" --json > "$RUNNER_TEMP/sdk-second.json"
          test "$(python3 cli/vellum_cli.py --version)" = \
            "vellum $VELLUM_RELEASE_VERSION"
          archive="$VELLUM_RELEASE_ARCHIVE"
          test "$archive" = \
            "vellum-sdk-$VELLUM_RELEASE_VERSION-darwin-arm64.tar.gz"
          cmp "$first/$archive" "$second/$archive"
          cmp "$first/SHA256SUMS" "$second/SHA256SUMS"
          (cd scripts && shasum -a 256 -c INSTALLER_SHA256SUMS)
          shasum -a 256 "$first/$archive" > "$RUNNER_TEMP/vellum-sdk.sha256"
          cp "$first/$archive" "$RUNNER_TEMP/$archive"
          cp scripts/install.sh "$RUNNER_TEMP/install.sh"
          cp scripts/install_core.py "$RUNNER_TEMP/install_core.py"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 \
              "$archive" \
              install.sh \
              install_core.py \
              | LC_ALL=C sort > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
          python3 scripts/verify_sdk_artifact.py \
            --archive "$RUNNER_TEMP/$archive" \
            --checksums "$RUNNER_TEMP/SHA256SUMS" --json \
            > "$RUNNER_TEMP/sdk-verification.json"
          python3 scripts/build_sterile_acceptance_bundle.py \
            --output "$RUNNER_TEMP/vellum-sterile-acceptance.tar.gz" \
            --json > "$RUNNER_TEMP/sterile-acceptance-bundle.json"

      - name: Verify the binary deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          dylib=build-gpu/graphics/libvellum-gpu.dylib
          app=build-gpu/apps/gpu-native/vellum-gpu-native.app/Contents/MacOS/vellum-gpu-native
          otool -l "$dylib" > "$RUNNER_TEMP/vellum-gpu-dylib-load-commands.txt"
          otool -l "$app" > "$RUNNER_TEMP/vellum-gpu-app-load-commands.txt"
          /usr/bin/grep -Eq 'minos 15\.0' "$RUNNER_TEMP/vellum-gpu-dylib-load-commands.txt"
          /usr/bin/grep -Eq 'minos 15\.0' "$RUNNER_TEMP/vellum-gpu-app-load-commands.txt"

      - name: Smoke every public template through the installed SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/templates-smoke-sdk"
          sh "$RUNNER_TEMP/install.sh" \
            --archive "$RUNNER_TEMP/$VELLUM_RELEASE_ARCHIVE" \
            --checksums "$RUNNER_TEMP/SHA256SUMS" \
            --install-dir "$prefix"
          python3 scripts/templates_smoke.py \
            --install-prefix "$prefix" \
            --output "$RUNNER_TEMP/templates-smoke.json" \
            --json > "$RUNNER_TEMP/templates-smoke.stdout.json"

      - name: Prove installed HTML import through DesignIR and GPU capture
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/templates-smoke-sdk"
          project="$RUNNER_TEMP/html-import-proof"
          source="$GITHUB_WORKSPACE/fixtures/html-import/index.html"
          run_json() {
            local output="$1"
            shift
            if ! "$@" > "$output"; then
              echo "installed SDK command failed: $*" >&2
              echo "--- $output ---" >&2
              cat "$output" >&2 || true
              return 1
            fi
          }
          run_json "$RUNNER_TEMP/html-import-create.json" \
            "$prefix/bin/vellum" --json create "HTML Import Proof" \
              --directory "$project" --no-verify
          run_json "$RUNNER_TEMP/html-import.json" \
            "$prefix/bin/vellum" --json import \
              "$source" --project "$project" \
              --source-type html --as main
          python3 - "$RUNNER_TEMP/html-import.json" "$project" <<'PY'
          import json
          import pathlib
          import sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if payload.get("status") != "imported":
              raise SystemExit(f"HTML import failed: {payload}")
          project = pathlib.Path(sys.argv[2])
          snapshot = next((project / "sources/imported/main").glob("*/source.json"))
          capture = next((project / "sources/imported/main").glob("*/capture.json"))
          provenance = json.loads(next((project / "sources/imported/main").glob("*/provenance.json")).read_text())
          lock = json.loads((project / "design/import.lock.json").read_text())
          if not snapshot.is_file() or not capture.is_file():
              raise SystemExit("HTML import did not retain source and capture snapshots")
          if provenance["sourceArtifact"]["kind"] != "html":
              raise SystemExit("HTML import did not retain html source artifact provenance")
          if lock["sources"]["main"]["sourceArtifactKind"] != "html":
              raise SystemExit("HTML import lock lost html artifact identity")
          PY
          run_json "$RUNNER_TEMP/html-import-design-check.json" \
            "$prefix/bin/vellum" --json design check --project "$project" --as main
          run_json "$RUNNER_TEMP/html-import-build.json" \
            "$prefix/bin/vellum" --json build --project "$project" --target macos
          run_json "$RUNNER_TEMP/html-import-capture.json" \
            "$prefix/bin/vellum" --json capture --project "$project" --target macos \
              --scenario smoke --output "$project/html-import-proof.png"
          file "$project/html-import-proof.png"
          shasum -a 256 "$project/html-import-proof.png" \
            > "$project/html-import-proof.png.sha256"

      - name: Record private-release trust controls
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! remote_row="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"; then
            echo "::error::Could not resolve remote release tag ref"
            exit 1
          fi
          read -r remote_type VELLUM_TAG_OBJECT_SHA <<EOF
          $remote_row
          EOF
          if [ "$remote_type" != tag ]; then
            echo "::error::Remote release ref is $remote_type, not an annotated tag"
            exit 1
          fi
          export VELLUM_TAG_OBJECT_SHA
          python3 scripts/verify_release_tag.py \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-name "$GITHUB_REF_NAME" \
            --tag-object-sha "$VELLUM_TAG_OBJECT_SHA" \
            --source-commit "$GITHUB_SHA" \
            --allowed-signers \
              "$GITHUB_WORKSPACE/provenance/release-signers.allowed_signers" \
            --expected-principal daniel.raffel@gmail.com \
            --expected-fingerprint \
              SHA256:eMlEuZcnW6NJDrKQBuN5EX1q69bOlIRPl6XmutVTgcs \
            --output "$RUNNER_TEMP/release-trust.json"
          python3 scripts/verify_immutable_release_preflight.py \
            --input provenance/immutable-release-preflight.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/immutable-release-preflight.json"
          printf 'VELLUM_TAG_OBJECT_SHA=%s\n' \
            "$VELLUM_TAG_OBJECT_SHA" >> "$GITHUB_ENV"

      - name: Gate every release mutation on exact provenance readiness
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Generous-Corp/vellum"
          runs="$RUNNER_TEMP/exact-provenance-runs.json"
          verified_provenance_run=""
          for attempt in {1..120}; do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/provenance.yml/runs" \
              -f branch="$GITHUB_REF_NAME" \
              -f event=push \
              -F per_page=20 > "$runs"
            if row="$(
              python3 scripts/select_exact_provenance_run.py \
                --runs-json "$runs" \
                --head-sha "$GITHUB_SHA" \
                --head-branch "$GITHUB_REF_NAME"
            )"; then
              :
            else
              selection_status=$?
              if [ "$selection_status" -ne 4 ]; then
                exit "$selection_status"
              fi
              row=""
            fi
            if [ -n "$row" ]; then
              IFS=$'\t' read -r provenance_run status conclusion <<< "$row"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "::error::Exact provenance run $provenance_run concluded $conclusion"
                  exit 1
                fi
                printf 'Verified exact provenance run %s for %s at %s\n' \
                  "$provenance_run" "$GITHUB_REF_NAME" "$GITHUB_SHA"
                verified_provenance_run="$provenance_run"
                break
              fi
            fi
            if [ "$attempt" -lt 120 ]; then
              sleep 10
            fi
          done
          if [ -z "$verified_provenance_run" ]; then
            echo "::error::Exact successful provenance run was not available within 20 minutes"
            exit 1
          fi
          sibling="$RUNNER_TEMP/exact-provenance-artifact"
          mkdir "$sibling"
          gh run download "$verified_provenance_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name provenance-report \
            --dir "$sibling"
          python3 scripts/verify_exact_provenance_artifact.py \
            --trust-json "$sibling/promotion-release-tag-trust.json" \
            --readiness-json "$sibling/authority-expansion-report.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --tag-object-sha "$VELLUM_TAG_OBJECT_SHA"

      - name: Upload retained GPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellum-gpu-macos-arm64-evidence
          path: |
            ${{ runner.temp }}/vellum-gpu-proof.png
            ${{ runner.temp }}/vellum-gpu-proof.txt
            ${{ runner.temp }}/vellum-gpu-proof.sha256
            ${{ runner.temp }}/vellum-gpu-dylib-load-commands.txt
            ${{ runner.temp }}/vellum-gpu-app-load-commands.txt
            ${{ runner.temp }}/html-import-proof/html-import-proof.png
            ${{ runner.temp }}/html-import-proof/html-import-proof.png.sha256
            ${{ runner.temp }}/html-import.json
            ${{ runner.temp }}/html-import-design-check.json
            ${{ runner.temp }}/html-import-build.json
            ${{ runner.temp }}/html-import-capture.json
            ${{ runner.temp }}/${{ env.VELLUM_RELEASE_ARCHIVE }}
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/install_core.py
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/vellum-sdk.sha256
            ${{ runner.temp }}/sdk-first.json
            ${{ runner.temp }}/sdk-second.json
            ${{ runner.temp }}/sdk-verification.json
            ${{ runner.temp }}/templates-smoke.json
            ${{ runner.temp }}/templates-smoke.stdout.json
            ${{ runner.temp }}/vellum-sterile-acceptance.tar.gz
            ${{ runner.temp }}/sterile-acceptance-bundle.json
            ${{ runner.temp }}/create_browser_provenance.py
            ${{ runner.temp }}/vellum_browser.py
            ${{ runner.temp }}/web-payload.json
            ${{ runner.temp }}/phase3-browser-evidence.json
            ${{ runner.temp }}/release-trust.json
            ${{ runner.temp }}/immutable-release-preflight.json
          if-no-files-found: warn
          retention-days: 90
  sterile-consumer:
    name: sterile-consumer
    needs: gpu-macos-arm64
    runs-on: ${{ fromJSON(vars.VELLUM_MACOS_RUNS_ON_JSON || '["self-hosted","macOS","ARM64","vellum-build-macos"]') }}
    steps:
      # The sterile journey drives a browser fixture, and job environments do
      # not inherit. Provision the same pinned browser the proof job uses, so
      # this lane never depends on one happening to exist on the runner.
      - name: Install the pinned Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: 151.0.7922.47

      - name: Export the pinned Chrome browser path
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          printf 'VELLUM_CHROME_PATH=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Download only the release-shaped inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vellum-gpu-macos-arm64-evidence
          path: ${{ runner.temp }}/vellum-input

      - name: Record exact Chrome browser provenance
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/vellum-input/create_browser_provenance.py" \
            --browser "$CHROME_PATH" \
            --requested-version 151.0.7922.47 \
            --source-action browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd \
            --output "$RUNNER_TEMP/browser-provenance.json"
          printf 'VELLUM_CHROME_PROVENANCE=%s\n' "$RUNNER_TEMP/browser-provenance.json" >> "$GITHUB_ENV"
          printf 'VELLUM_REQUIRE_CHROME_PROVENANCE=1\n' >> "$GITHUB_ENV"

      - name: Verify and extract the source-free acceptance bundle
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/vellum-input"
          bundle="$input/vellum-sterile-acceptance.tar.gz"
          expected="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' \
              "$input/sterile-acceptance-bundle.json"
          )"
          actual="$(shasum -a 256 "$bundle" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/sterile"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/sterile"
          printf 'VELLUM_STERILE_ROOT=%s\n' \
            "$RUNNER_TEMP/sterile/vellum-sterile-acceptance" >> "$GITHUB_ENV"

      - name: Demonstrate the checkout-contamination negative control
        shell: bash
        run: |
          set -euo pipefail
          fake="$RUNNER_TEMP/negative-control/vellum"
          mkdir -p "$fake/.git" "$fake/provenance"
          printf '{}\n' > "$fake/provenance/pulp-extraction.json"
          VELLUM_VALIDATOR="$VELLUM_STERILE_ROOT/validate_installed_sdk.py" \
            SEARCH_ROOT="$RUNNER_TEMP/negative-control" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "validator", os.environ["VELLUM_VALIDATOR"]
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          findings = module.checkout_contamination_findings(
              [Path(os.environ["SEARCH_ROOT"])]
          )
          if len(findings) != 1 or not findings[0].endswith("/vellum"):
              raise SystemExit(f"negative control did not fail closed: {findings}")
          PY
          rm -rf "$RUNNER_TEMP/negative-control"

      - name: Run the complete installed journey without a framework checkout
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/vellum-input"
          test ! -e "$GITHUB_WORKSPACE/.git"
          python3 "$VELLUM_STERILE_ROOT/validate_installed_sdk.py" \
            --archive "$input/$VELLUM_RELEASE_ARCHIVE" \
            --checksums "$input/SHA256SUMS" \
            --forbid-path "$GITHUB_WORKSPACE" \
            --runner-search-root "$RUNNER_WORKSPACE" \
            --output "$RUNNER_TEMP/sdk-installed-validation.json" \
            --json > "$RUNNER_TEMP/sdk-installed-validation.stdout.json"

      - name: Retain the source-free journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellum-sterile-consumer-evidence
          path: |
            ${{ runner.temp }}/sdk-installed-validation.json
            ${{ runner.temp }}/sdk-installed-validation.stdout.json
          if-no-files-found: error
          retention-days: 90
