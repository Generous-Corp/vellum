name: Product contract

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  # GitHub keeps only one pending run per concurrency group. Keep PRs keyed
  # by ref so obsolete commits are canceled, but isolate every trusted or
  # manually dispatched run by run ID.
  group: ${{ github.event_name == 'pull_request' && format('vellum-product-pr-{0}', github.ref) || format('vellum-product-run-{0}', github.run_id) }}
  # A newer PR commit supersedes the older product check. Main and release
  # validation remain non-cancelable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-quality:
    name: product-quality
    runs-on: ${{ fromJSON(vars.VELLUM_LINUX_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    steps:
      - name: Check out full preserved history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/vellum-ui/package-lock.json

      - name: Verify CLI, installer, artifact, and agent contracts
        run: |
          python3 -m unittest discover -s cli/tests -p 'test_*.py'
          python3 -m unittest tools.agent_instructions.test_verify
          python3 scripts/test_readme_exec.py
          python3 scripts/readme_exec.py --lint
          python3 scripts/test_readme_lint.py
          python3 scripts/readme_lint.py
          python3 scripts/test_docs_sync.py
          python3 scripts/docs_sync.py --check
          python3 scripts/test_ci_runner_policy.py
          python3 scripts/test_merge_on_green.py
          python3 cli/tests/test_templates.py
          python3 scripts/template_guard.py
          python3 scripts/test_templates_smoke.py
          python3 scripts/test_sterile_acceptance_bundle.py
          python3 scripts/test_verify_budget_ratification.py
          python3 scripts/verify_budget_ratification.py
          python3 tools/provenance/test_verify_downstream_consumers.py
          python3 tools/provenance/verify_downstream_consumers.py
          python3 tools/provenance/verify_extraction.py \
            --output "$RUNNER_TEMP/provenance-report.json"

      - name: Verify DesignIR and UI packages
        run: |
          npm run check --prefix packages/vellum-design-ir
          npm ci --prefix packages/vellum-ui
          npm run check --prefix packages/vellum-ui

      - name: Upload product-contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellum-product-contract
          path: ${{ runner.temp }}/provenance-report.json
          if-no-files-found: warn
          retention-days: 90
