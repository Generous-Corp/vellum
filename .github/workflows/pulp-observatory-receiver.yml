name: Pulp observatory receiver

on:
  repository_dispatch:
    types: [pulp-change-landed]
  # Every landing on main may leave the Vellum cursor behind: pull requests
  # record their own observation events and this receiver advances the cursor
  # afterwards, through the same evidence branch, which the steward merges on green.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pulp_commit:
        description: Exact landed Pulp commit used as a required lower bound
        required: true
        type: string
      operation:
        description: Reconcile only, or enable live delivery after a proved no-op
        required: true
        default: replay
        type: choice
        options: [replay, enable]

# GITHUB_TOKEN is never used: every checkout, push and pull-request write
# uses a per-run App token with a scope set a completed run has proved.
permissions:
  contents: read

concurrency:
  group: vellum-pulp-observatory-cursor
  cancel-in-progress: false

jobs:
  receiver:
    name: receiver
    timeout-minutes: 60
    # Live Pulp delivery (repository_dispatch) is switched by the committed
    # provenance/pulp-observatory/live-delivery.json, read below from trusted
    # main, not by a repository variable: no token this workflow can mint may
    # write variables, and a committed switch lands through the same gates as
    # every other change.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'repository_dispatch'
    runs-on: ${{ fromJSON(vars.VELLUM_LINUX_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    steps:
      # Tokens come from the same GitHub App the merge steward uses, minted
      # per run and scoped to one repository each. A pull request pushed and
      # opened with an App token triggers its required checks; one opened with
      # GITHUB_TOKEN never would, and the evidence PR could never land.
      - name: Mint a Vellum evidence token
        id: evidence-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: Generous-Corp
          repositories: vellum
          # Exactly what landing an evidence or switch pull request needs:
          # push the branch and open the PR. Requesting more than the
          # installation grants fails the mint on every push to main (proved
          # 2026-10-11, run 38173182114), so nothing here asks for more.
          permission-contents: write
          permission-pull-requests: write

      - name: Mint a read-only Pulp token for the fresh checkout
        id: pulp-reader
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: Generous-Corp
          repositories: pulp
          permission-contents: read

      - name: Check out trusted Vellum main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.evidence-token.outputs.token }}
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check out freshly fetched Pulp main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Generous-Corp/pulp
          token: ${{ steps.pulp-reader.outputs.token }}
          ref: main
          path: .receiver-pulp
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize trusted delivery coordinates
        id: coordinates
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PULP_COMMIT: ${{ inputs.pulp_commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          main = os.popen("git -C .receiver-pulp rev-parse HEAD").read().strip()
          try:
              switch = json.loads(
                  Path("provenance/pulp-observatory/live-delivery.json").read_text(encoding="utf-8")
              )
              live = isinstance(switch, dict) and switch.get("enabled") is True
          except (OSError, json.JSONDecodeError, TypeError):
              # Missing or malformed controls fail closed to disabled delivery.
              switch = {}
              live = False
          skip = os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch" and not live
          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
              payload = json.loads(os.environ["DISPATCH_PAYLOAD"])
              lower = payload.get("source_commit")
              payload_path = Path(os.environ["RUNNER_TEMP"]) / "receiver-payload.json"
              payload_path.write_text(
                  json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
              )
              payload_argument = str(payload_path)
          elif os.environ["GITHUB_EVENT_NAME"] == "push":
              # A Vellum landing: the Pulp side has no new lower bound, so the
              # committed Pulp cursor is the bound and the plan decides from
              # the Vellum cursor alone.
              cursor = json.loads(Path("provenance/pulp-observatory/cursor.json").read_text())
              lower = cursor["pulp"]["last_scanned_commit"]
              payload_argument = ""
          else:
              lower = os.environ["INPUT_PULP_COMMIT"]
              payload_argument = ""
          if not isinstance(lower, str) or re.fullmatch(r"[0-9a-f]{40}", lower) is None:
              raise SystemExit("delivery lower bound must be a full lowercase SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"main={main}\n")
              output.write(f"lower={lower}\n")
              output.write(f"payload={payload_argument}\n")
              output.write(f"live={'true' if live else 'false'}\n")
              output.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Prove delivery and plan latest-head coalescing
        id: plan
        # A live Pulp delivery arriving while the committed switch is off is
        # recorded in the summary and otherwise ignored.
        if: steps.coordinates.outputs.skip != 'true'
        env:
          PULP_MAIN: ${{ steps.coordinates.outputs.main }}
          LOWER_BOUND: ${{ steps.coordinates.outputs.lower }}
          PAYLOAD_PATH: ${{ steps.coordinates.outputs.payload }}
        run: |
          set -euo pipefail
          payload_args=()
          if test -n "$PAYLOAD_PATH"; then
            payload_args=(--payload "$PAYLOAD_PATH")
          fi
          python3 tools/provenance/receiver.py \
            --root . \
            --pulp-repo .receiver-pulp \
            --pulp-main "$PULP_MAIN" \
            --lower-bound "$LOWER_BOUND" \
            --vellum-repo . \
            --vellum-main "$(git rev-parse HEAD)" \
            "${payload_args[@]}" \
            --output "$RUNNER_TEMP/receiver-plan.json"
          jq -r '"status=" + .status, "target=" + .reconcile_target' \
            "$RUNNER_TEMP/receiver-plan.json" >> "$GITHUB_OUTPUT"

      - name: Reconcile through the latest verified durable event head
        if: steps.plan.outputs.status == 'reconcile'
        env:
          RECONCILE_TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/provenance/observatory.py reconcile \
            --pulp-repo .receiver-pulp \
            --vellum-repo . \
            --pulp-target "$RECONCILE_TARGET" \
            --vellum-target "$(git rev-parse HEAD)" \
            --now "$now" \
            --write \
            --output "$RUNNER_TEMP/receiver-reconcile.json"
          python3 tools/provenance/observatory.py verify \
            --pulp-repo .receiver-pulp \
            --vellum-repo . \
            --git-base "$(git rev-parse HEAD)" \
            --pulp-target "$RECONCILE_TARGET" \
            --vellum-target "$(git rev-parse HEAD)"

      - name: Prepare the evidence-only coalescing PR
        if: steps.plan.outputs.status == 'reconcile'
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          EVIDENCE_BRANCH: automation/pulp-observatory-coalesced
        run: |
          set -euo pipefail
          vellum_main="$(git rev-parse HEAD)"
          unexpected="$({
            git status --short --untracked-files=all -- \
              . ':(exclude).receiver-pulp/**' | \
              awk '{print $2}' | while read -r path; do
              case "$path" in
                provenance/pulp-observatory/cursor.json|\
                provenance/pulp-observatory/reports/current.json|\
                provenance/pulp-observatory/reports/current.md|\
                provenance/pulp-observatory/events/*.yaml) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          } || true)"
          test -z "$unexpected" || {
            echo "receiver generated non-evidence paths: $unexpected" >&2
            exit 1
          }
          git config user.name vellum-observatory-receiver
          git config user.email vellum-observatory-receiver@users.noreply.github.com
          git switch -C "$EVIDENCE_BRANCH"
          git add provenance/pulp-observatory
          git commit -m "chore(provenance): coalesce Pulp observatory evidence"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$vellum_main" || {
            echo "Vellum main advanced while evidence was prepared; retry required" >&2
            exit 1
          }
          remote_sha="$(
            git ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | awk '{print $1}'
          )"
          if test -n "$remote_sha"; then
            git push \
              --atomic \
              --force-with-lease="refs/heads/$EVIDENCE_BRANCH:$remote_sha" \
              origin \
              "$vellum_main:refs/heads/main" \
              "HEAD:refs/heads/$EVIDENCE_BRANCH"
          else
            git push --atomic origin \
              "$vellum_main:refs/heads/main" \
              "HEAD:refs/heads/$EVIDENCE_BRANCH"
          fi
          open_prs="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$GITHUB_REPOSITORY_OWNER:$EVIDENCE_BRANCH" \
              -f per_page=100 \
              --jq 'length' | \
              awk '{ total += $1 } END { print total + 0 }'
          )"
          if test "$open_prs" = 0; then
            gh pr create \
              --base main \
              --head "$EVIDENCE_BRANCH" \
              --title "chore(provenance): coalesce Pulp observatory evidence" \
              --body "Automated evidence-only reconciliation. Lands by merge commit once the required checks pass; never squash or rebase."
          fi

      - name: Enable live delivery only across a proved current barrier
        if: inputs.operation == 'enable'
        env:
          # Enabling is a committed change: the switch file lands through a
          # pull request pushed and opened with the same App token as the
          # evidence PR, so it passes the required checks and the queue like
          # any other change, and its landing on main runs this receiver.
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          RECONCILE_STATUS: ${{ steps.plan.outputs.status }}
          LATEST_TARGET: ${{ steps.plan.outputs.target }}
          LIVE_BRANCH: automation/pulp-observatory-live-delivery
        run: |
          set -euo pipefail
          test "$RECONCILE_STATUS" = noop || {
            echo "enable barrier requires a fully covered committed cursor" >&2
            exit 1
          }
          vellum_main="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("provenance/pulp-observatory/live-delivery.json")
          switch = json.loads(path.read_text(encoding="utf-8"))
          switch["enabled"] = True
          switch["enabled_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          switch["barrier_pulp_commit"] = os.environ["LATEST_TARGET"]
          path.write_text(json.dumps(switch, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name vellum-observatory-receiver
          git config user.email vellum-observatory-receiver@users.noreply.github.com
          git switch -C "$LIVE_BRANCH"
          git add provenance/pulp-observatory/live-delivery.json
          git commit -m "chore(provenance): enable live Pulp delivery across a proved barrier"
          git push --atomic --force-with-lease origin \
            "$vellum_main:refs/heads/main" \
            "HEAD:refs/heads/$LIVE_BRANCH"
          gh pr create \
            --base main \
            --head "$LIVE_BRANCH" \
            --title "chore(provenance): enable live Pulp delivery" \
            --body "Switches provenance/pulp-observatory/live-delivery.json on across the barrier proved by run $GITHUB_RUN_ID. Lands by merge commit once the required provenance-verify and steward checks pass; never squash or rebase."

      - name: Summarize receiver outcome
        if: always()
        env:
          SUMMARY_LOWER_BOUND: ${{ steps.coordinates.outputs.lower }}
          SUMMARY_TARGET: ${{ steps.plan.outputs.target }}
          SUMMARY_STATUS: ${{ steps.plan.outputs.status }}
          SUMMARY_LIVE: ${{ steps.coordinates.outputs.live }}
        run: |
          {
            echo '### Pulp observatory receiver'
            echo
            echo "- outcome: ${SUMMARY_STATUS:-failed-closed}"
            echo "- supplied lower bound: ${SUMMARY_LOWER_BOUND:-unresolved}"
            echo "- coalesced target: ${SUMMARY_TARGET:-unresolved}"
            echo "- live control: ${SUMMARY_LIVE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
