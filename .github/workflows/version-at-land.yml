name: Version at land

# Proposes Vellum's next version from what landed. After every landing on main,
# scripts/version_at_land.py counts the changes since the newest release tag;
# when something that ships has changed, it rewrites every version surface to
# the next version and this workflow opens that change as a pull request from
# the automation/version-bump branch. The pull request lands through the merge
# queue like any other change, and its landing is the release: release-tag.yml
# tags the observatory reconcile that covers it. Nothing here tags, signs or
# names the `release` environment.
#
# Every repository script runs with `python3 -I` in a step that holds no token.
# The App token that pushes the branch and opens the pull request is minted
# last, in steps that run no repository code.
on:
  push:
    branches: [main]
  # A backstop for a landing whose push run was lost; a run with nothing to do
  # ends after the plan.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: version-at-land
  cancel-in-progress: false

jobs:
  version-at-land:
    name: version-at-land
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUMP_BRANCH: automation/version-bump
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the next version
        id: plan
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Generous-Corp/vellum
          main="$(git rev-parse HEAD)"
          if ! python3 -I scripts/version_at_land.py plan --commit "$main" --remote origin \
            > "$RUNNER_TEMP/plan.txt" 2> "$RUNNER_TEMP/plan-reason.txt"; then
            echo "::error::$(head -n 1 "$RUNNER_TEMP/plan-reason.txt")"
            exit 1
          fi
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
          printf 'main=%s\n' "$main" >> "$GITHUB_OUTPUT"
          { echo '### Version at land'; echo; cat "$RUNNER_TEMP/plan-reason.txt"; } >> "$GITHUB_STEP_SUMMARY"
          head -n 1 "$RUNNER_TEMP/plan-reason.txt" | sed 's/^/::notice::/'

      # An open bump pull request that already proposes this version is left
      # alone, so its checks and review stand.
      - name: Read the standing bump pull request
        id: standing
        if: steps.plan.outputs.action == 'bump'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open \
            -f head="$GITHUB_REPOSITORY_OWNER:$BUMP_BRANCH" -f per_page=100 --jq '.[0].number // ""')"
          proposed=""
          if git fetch --quiet --no-tags origin "refs/heads/$BUMP_BRANCH"; then
            proposed="$(git show FETCH_HEAD:CMakeLists.txt \
              | sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\)[[:space:]]*$/\1/p' | head -n 1)"
          fi
          current=false
          if [ -n "$number" ] && [ "$proposed" = "$VERSION" ]; then
            current=true
            echo "::notice::#$number already proposes $VERSION"
          fi
          printf 'number=%s\ncurrent=%s\n' "$number" "$current" >> "$GITHUB_OUTPUT"

      - name: Write the version bump
        if: steps.plan.outputs.action == 'bump' && steps.standing.outputs.current != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          LEVEL: ${{ steps.plan.outputs.level }}
          SINCE: ${{ steps.plan.outputs.since }}
        run: |
          set -euo pipefail
          git switch -C "$BUMP_BRANCH"
          python3 -I scripts/version_at_land.py apply --to "$VERSION" > "$RUNNER_TEMP/surfaces.txt"
          xargs git add -- < "$RUNNER_TEMP/surfaces.txt"
          {
            echo "chore(release): bump version to $VERSION"
            echo
            echo "A $LEVEL bump from the changes landed since $SINCE. Landing this pull"
            echo "request releases v$VERSION: release-tag.yml tags the observatory"
            echo "reconcile that covers it."
            echo
            sed -n '2,$p' "$RUNNER_TEMP/plan-reason.txt"
            echo
            echo 'Version-Bump: skip reason="the version-at-land bump itself"'
          } > "$RUNNER_TEMP/message.txt"
          git -c user.name=vellum-version-at-land \
            -c user.email=vellum-version-at-land@users.noreply.github.com \
            commit --quiet --file "$RUNNER_TEMP/message.txt"
          {
            echo "Automated version bump from \`version-at-land.yml\`."
            echo
            echo "A **$LEVEL** bump to **$VERSION** from the changes landed since \`$SINCE\`."
            echo "Landing it releases \`v$VERSION\`: \`release-tag.yml\` tags the observatory reconcile"
            echo "that covers it. Lands by merge commit once the required checks pass; never squash or rebase."
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan-reason.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          git diff --stat HEAD^ HEAD >> "$GITHUB_STEP_SUMMARY"

      # The App token can push the bump branch and open its pull request, and
      # nothing more. A pull request opened with it runs its required checks;
      # one opened with GITHUB_TOKEN never would.
      - name: Mint the bump token
        id: bump-token
        if: steps.plan.outputs.action == 'bump' && steps.standing.outputs.current != 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: Generous-Corp
          repositories: vellum
          permission-contents: write
          permission-pull-requests: write

      - name: Push the bump branch and open its pull request
        if: steps.plan.outputs.action == 'bump' && steps.standing.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ steps.bump-token.outputs.token }}
          MAIN: ${{ steps.plan.outputs.main }}
          VERSION: ${{ steps.plan.outputs.version }}
          NUMBER: ${{ steps.standing.outputs.number }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/$GITHUB_REPOSITORY"
          lease="$(git -c "http.https://github.com/.extraheader=$auth" ls-remote "$remote" \
            "refs/heads/$BUMP_BRANCH" | awk '{print $1}')"
          # Pushing main to the commit the plan read is refused unless main is
          # still there, so a bump is never proposed against a main it did not count.
          git -c "http.https://github.com/.extraheader=$auth" push --atomic \
            --force-with-lease="refs/heads/$BUMP_BRANCH:$lease" "$remote" \
            "$MAIN:refs/heads/main" "HEAD:refs/heads/$BUMP_BRANCH"
          title="chore(release): bump version to $VERSION"
          if [ -n "$NUMBER" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" -f title="$title" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
            echo "updated #$NUMBER to propose $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BUMP_BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          fi
