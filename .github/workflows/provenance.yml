name: Provenance and forbidden dependencies

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance-verify:
    name: provenance-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out full preserved history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify extraction and active-source quarantine
        run: |
          python3 tools/provenance/test_verify_extraction.py
          python3 tools/provenance/verify_extraction.py \
            --output "$RUNNER_TEMP/provenance-report.json"

      - name: Verify pinned Pulp tooling disposition
        run: |
          python3 tools/provenance/test_verify_pulp_tooling_disposition.py
          python3 tools/provenance/verify_pulp_tooling_disposition.py \
            --output "$RUNNER_TEMP/pulp-tooling-disposition-report.json"

      - name: Verify versioned agent-authoring instructions
        run: |
          python3 tools/agent_instructions/test_verify.py
          python3 tools/agent_instructions/verify.py --json \
            > "$RUNNER_TEMP/agent-instructions-report.json"

      - name: Verify prepared authority protocol and negative controls
        run: |
          python3 tools/provenance/test_verify_authority_activation.py
          python3 tools/provenance/verify_authority_activation.py verify-prepared \
            > "$RUNNER_TEMP/authority-prepared-report.json"

      - name: Check out exact observed Pulp cursor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Generous-Corp/pulp
          ref: 1560decae5ebafa36cec4ef91df2f192db0369e0
          path: .observatory-pulp
          fetch-depth: 0
          persist-credentials: false

      - name: Verify two-way observatory health and negative controls
        run: |
          python3 tools/provenance/test_observatory.py
          python3 tools/provenance/observatory.py verify \
            --pulp-repo .observatory-pulp \
            --vellum-repo . \
            --pulp-target 1560decae5ebafa36cec4ef91df2f192db0369e0 \
            --vellum-target "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/observatory-health-report.json"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provenance-report
          path: |
            ${{ runner.temp }}/provenance-report.json
            ${{ runner.temp }}/pulp-tooling-disposition-report.json
            ${{ runner.temp }}/agent-instructions-report.json
            ${{ runner.temp }}/authority-prepared-report.json
            ${{ runner.temp }}/observatory-health-report.json
          if-no-files-found: error
          retention-days: 90
