name: Provenance and forbidden dependencies

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*', 'authority/**']

permissions:
  contents: read

jobs:
  forbidden-deps:
    name: forbidden-deps
    runs-on: ${{ fromJSON(vars.VELLUM_LINUX_RUNS_ON_JSON || '"ubuntu-latest"') }}
    steps:
      - name: Check out the exact source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify active-source quarantine and forbidden dependencies
        run: |
          python3 tools/provenance/test_verify_extraction.py
          python3 tools/provenance/verify_extraction.py \
            --output "$RUNNER_TEMP/forbidden-deps-report.json"

      - name: Retain forbidden-dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vellum-forbidden-deps
          path: ${{ runner.temp }}/forbidden-deps-report.json
          if-no-files-found: error
          retention-days: 90

  provenance-verify:
    name: provenance-verify
    runs-on: ${{ fromJSON(vars.VELLUM_LINUX_RUNS_ON_JSON || '"ubuntu-latest"') }}
    env:
      VELLUM_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out full preserved history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify extraction and active-source quarantine
        run: |
          python3 tools/provenance/test_verify_extraction.py
          python3 tools/provenance/verify_extraction.py \
            --output "$RUNNER_TEMP/provenance-report.json"

      - name: Verify pinned Pulp tooling disposition
        run: |
          python3 tools/provenance/test_verify_pulp_tooling_disposition.py
          python3 tools/provenance/verify_pulp_tooling_disposition.py \
            --output "$RUNNER_TEMP/pulp-tooling-disposition-report.json"

      - name: Verify versioned agent-authoring instructions
        run: |
          python3 tools/agent_instructions/test_verify.py
          python3 tools/agent_instructions/verify.py --json \
            > "$RUNNER_TEMP/agent-instructions-report.json"

      - name: Test authority protocol and negative controls
        run: |
          python3 tools/provenance/test_verify_authority_activation.py

      - name: Verify authority-start control plane
        if: ${{ !startsWith(github.ref, 'refs/tags/authority/') }}
        run: |
          python3 tools/provenance/verify_authority_activation.py verify-ready \
            > "$RUNNER_TEMP/authority-ready-report.json"

      - name: Resolve the pending authority record
        if: startsWith(github.ref, 'refs/tags/authority/')
        id: authority-record
        env:
          EXPECTED_AUTHORITY_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          records = sorted(
              Path("provenance/authority/records").glob("*.json")
          )
          if len(records) != 1:
              raise SystemExit(
                  "authority ref must contain exactly one direct pending record"
              )
          record = json.loads(records[0].read_text(encoding="utf-8"))
          if record.get("authority_record_ref") != os.environ[
              "EXPECTED_AUTHORITY_REF"
          ]:
              raise SystemExit(
                  "pending record does not name the checked-out authority ref"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              output.write(f"path={records[0].as_posix()}\n")
              output.write(
                  f"pulp-candidate={record['pulp_candidate_commit']}\n"
              )
          PY

      - name: Verify the pinned owner signature on the authority tag
        if: startsWith(github.ref, 'refs/tags/authority/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_row="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          read -r remote_type tag_object_sha <<EOF
          $remote_row
          EOF
          test "$remote_type" = tag
          if ! git cat-file -e "$tag_object_sha^{tag}" 2>/dev/null; then
            git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          fi
          python3 scripts/verify_release_tag.py \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-name "$GITHUB_REF_NAME" \
            --tag-object-sha "$tag_object_sha" \
            --source-commit "$GITHUB_SHA" \
            --allowed-signers \
              "$GITHUB_WORKSPACE/provenance/release-signers.allowed_signers" \
            --expected-principal daniel.raffel@gmail.com \
            --expected-fingerprint \
              SHA256:eMlEuZcnW6NJDrKQBuN5EX1q69bOlIRPl6XmutVTgcs \
            --output "$RUNNER_TEMP/authority-tag-trust.json"

      - name: Check out the exact Pulp activation candidate
        if: startsWith(github.ref, 'refs/tags/authority/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Generous-Corp/pulp
          ref: ${{ steps.authority-record.outputs.pulp-candidate }}
          path: .authority-pulp
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the committed pending authority record
        if: startsWith(github.ref, 'refs/tags/authority/')
        run: |
          python3 tools/provenance/verify_authority_activation.py \
            verify-pending \
            --pulp-repo .authority-pulp \
            --pulp-ownership-commit \
              '${{ steps.authority-record.outputs.pulp-candidate }}' \
            --record-path '${{ steps.authority-record.outputs.path }}' \
            --authority-record-commit "$GITHUB_SHA" \
            --expected-authority-ref "$GITHUB_REF" \
            --output "$RUNNER_TEMP/authority-pending-report.json"

      - name: Resolve the committed Pulp observatory cursor
        id: observatory-cursor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          cursor = json.loads(
              Path("provenance/pulp-observatory/cursor.json").read_text(
                  encoding="utf-8"
              )
          )
          commit = cursor["pulp"]["last_scanned_commit"]
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("observatory Pulp cursor is not a full commit SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"pulp-sha={commit}\n")
          PY

      - name: Check out exact observed Pulp cursor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Generous-Corp/pulp
          ref: ${{ steps.observatory-cursor.outputs.pulp-sha }}
          path: .observatory-pulp
          fetch-depth: 0
          persist-credentials: false

      - name: Verify two-way observatory health and negative controls
        run: |
          python3 tools/provenance/test_observatory.py
          python3 tools/provenance/observatory.py verify \
            --pulp-repo .observatory-pulp \
            --vellum-repo . \
            --pulp-target "${{ steps.observatory-cursor.outputs.pulp-sha }}" \
            --vellum-target "$VELLUM_TARGET_SHA" \
            --output "$RUNNER_TEMP/observatory-health-report.json"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provenance-report
          path: |
            ${{ runner.temp }}/provenance-report.json
            ${{ runner.temp }}/pulp-tooling-disposition-report.json
            ${{ runner.temp }}/agent-instructions-report.json
            ${{ runner.temp }}/authority-ready-report.json
            ${{ runner.temp }}/authority-pending-report.json
            ${{ runner.temp }}/authority-tag-trust.json
            ${{ runner.temp }}/observatory-health-report.json
          if-no-files-found: error
          retention-days: 90
