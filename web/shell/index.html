<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Vellum browser/Wasm proof</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <canvas id="vellum-canvas" aria-label="Vellum browser proof"></canvas>
      <p id="status">Starting shared C++ runtime…</p>
      <pre id="proof" aria-label="Runtime proof"></pre>
    </main>
    <script>
      function reportBootError(value) {
        fetch('/__vellum_proof', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ bootError: String(value && (value.stack || value.message) || value) }),
        }).catch(() => {});
      }
      addEventListener('error', (event) => reportBootError(event.error || event.message));
      addEventListener('unhandledrejection', (event) => reportBootError(event.reason));
    </script>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
