# Shipyard settings this repository's base branch carries.

[auto_merge]
# Who may sign the fleet App's `verdict: APPROVE`: an approval posted through
# ghapp counts only with a `reviewer: <name>` line naming one of these. This
# list beats any host's reviewer-signers.json. `shipyard review-verdict` and
# the `review-verdict` status read only this list, never a host file, and
# refuse every App approval in a review-required repository that has none.
reviewer_signers = ["pulp-review", "infra-review2"]
# Only a scheduled reviewer pass may approve: an App APPROVE counts only when
# its ghapp session stamp matches one of these globs (a HOLD from any session
# still counts).
reviewer_stamp_sessions = ["fleet-pass-reviewer-*"]

[queue.environment_requeue]
# Re-enqueue an approved head once when its merge-queue ejection was not the
# head's fault (runner/infra failure, a check also failing on main, or a check
# that passed on the PR head). Counted from GitHub's timeline; a HOLD or a
# missing approval still blocks. Read from the base branch.
enabled = true

[validation]
# Vellum has no skill-sync or version-bump gate scripts (those are Pulp's).
# Declare it so `shipyard pr` skips them instead of failing on the missing
# skill_sync_check.py; agents then use the normal Shipyard PR flow.
pr_gates = false

[base_health]
# Red-main fix-first (Shipyard PR 1279; docs/automated-draining.md in the
# Shipyard repo): when one required check fails in consecutive merge groups and
# the base tip confirms it, hold other approved heads and enqueue the named fix
# with `jump: true`. `merge_group_pause` is left unset (dry-run): nothing
# already queued is removed.
merge_group_hold = "on"
auto_jump = "on"

[project]
name = "vellum"
type = "python"
platforms = ["macos"]

# `shipyard pr` validates through a declared target. Vellum's local validation
# is scripts/gates.sh: the required checks that need no GPU, run against the
# committed range. The GPU and sterile-consumer lanes run only in CI.
[validation.default]
command = "scripts/gates.sh origin/main"

[targets.mac]
backend = "local"
platform = "macos-arm64"
