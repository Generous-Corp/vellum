<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <clipPath id="round"><circle cx="50" cy="60" r="30"/></clipPath>
    <clipPath id="pair">
      <rect x="110" y="20" width="20" height="80"/>
      <rect x="150" y="20" width="20" height="80"/>
    </clipPath>
    <mask id="half">
      <rect x="50" y="100" width="50" height="20" fill="#ffffff"/>
      <rect x="100" y="100" width="50" height="20" fill="#000000"/>
    </mask>
  </defs>
  <rect id="clipped" x="10" y="20" width="80" height="80" fill="#00a000" clip-path="url(#round)"/>
  <rect id="bars" x="100" y="10" width="90" height="100" fill="#0050ff" clip-path="url(#pair)"/>
  <g id="masked" mask="url(#half)">
    <rect id="band" x="60" y="104" width="80" height="12" fill="#ff0000"/>
  </g>
</svg>
