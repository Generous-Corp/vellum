<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="span" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="turned" gradientTransform="rotate(90 0.5 0.5)">
      <stop offset="0" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.5">
      <stop offset="0" stop-color="#ffff00"/>
      <stop offset="1" stop-color="#000080"/>
    </radialGradient>
  </defs>
  <rect id="wide" x="0" y="10" width="200" height="30" fill="url(#span)"/>
  <rect id="tall" x="20" y="50" width="40" height="60" fill="url(#turned)"/>
  <ellipse id="lens" cx="130" cy="80" rx="50" ry="30" fill="url(#focal)"/>
</svg>
