<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <title>Gradient swatches</title>
  <defs>
    <linearGradient id="across">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0.25" x2="0" y2="0.75">
      <stop offset="0" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <rect id="ramp" x="20" y="10" width="160" height="30" fill="url(#across)"/>
  <rect id="column" x="20" y="50" width="40" height="60" fill="url(#down)"/>
  <circle id="dot" cx="110" cy="80" r="30" fill="url(#glow)"/>
  <rect id="swatch" x="150" y="60" width="40" height="40" fill="#e11d48"/>
</svg>
